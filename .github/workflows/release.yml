name: Release

# Cara memicu release:
#   1. OTOMATIS: setiap push ke branch main -> versi patch naik (v0.1.2 -> v0.1.3).
#      Push yang hanya mengubah dokumentasi (*.md, LICENSE) tidak memicu release.
#      Untuk melewati release, tambahkan [skip ci] di pesan commit.
#   2. Tombol "Run workflow" di tab Actions -> pilih patch/minor/major.
#   3. Push tag manual: git tag v1.0.0 && git push origin v1.0.0
# Catatan: tag yang dibuat bot memakai GITHUB_TOKEN sehingga tidak memicu workflow ini lagi.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bump:
        description: "Jenis kenaikan versi"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # butuh semua tag untuk menghitung versi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        # Target Windows: di Linux gopacket/pcap butuh cgo + libpcap sehingga vet gagal
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Tentukan versi
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            LAST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
            LAST=${LAST:-v0.0.0}
            IFS=. read -r MAJ MIN PAT <<< "${LAST#v}"
            case "${{ inputs.bump }}" in
              major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN+1)); PAT=0 ;;
              *)     PAT=$((PAT+1)) ;;
            esac
            VERSION="v${MAJ}.${MIN}.${PAT}"
            echo "Tag terakhir: ${LAST} -> versi baru: ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pasang libpcap untuk Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Build binary Windows
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CGO_ENABLED: "0" # gopacket/pcap di Windows memuat wpcap.dll saat runtime, tanpa cgo
        run: |
          mkdir -p dist
          for ARCH in amd64; do
            NAME="synwatcher_${VERSION}_windows_${ARCH}"
            mkdir -p "build/${NAME}"
            GOOS=windows GOARCH=${ARCH} go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/${NAME}/synwatcher.exe" .
            # Salin binary telanjang langsung ke dist
            cp "build/${NAME}/synwatcher.exe" "dist/synwatcher_windows_${ARCH}.exe"
            # Buat paket zip bundel
            cp README.md LICENSE getnet.ps1 install.ps1 "build/${NAME}/"
            (cd build && zip -qr "../dist/${NAME}.zip" "${NAME}")
          done

      - name: Build binary Linux amd64
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          CGO_ENABLED: "1" # Di Linux, libpcap membutuhkan cgo
        run: |
          NAME="synwatcher_${VERSION}_linux_amd64"
          mkdir -p "build/${NAME}"
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "build/${NAME}/synwatcher" .
          # Salin binary telanjang langsung ke dist
          cp "build/${NAME}/synwatcher" "dist/synwatcher_linux_amd64"
          # Buat paket tar.gz bundel
          cp README.md LICENSE install.sh "build/${NAME}/"
          tar -czf "dist/${NAME}.tar.gz" -C build "${NAME}"
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Buat tag (push ke main / tombol)
        if: github.ref_type != 'tag'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## Cara pakai
            1. Install [Npcap](https://npcap.com/#download) (centang *WinPcap API-compatible mode*).
            2. Jalankan cacheDB di `127.0.0.1:50051`.
            3. Ekstrak zip, lalu jalankan sebagai Administrator:
               ```powershell
               Get-NetAdapter | Select Name, InterfaceGuid, Status
               .\synwatcher.exe -iface "\Device\NPF_{GUID}"
               ```
